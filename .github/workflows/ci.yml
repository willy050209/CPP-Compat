name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - C++${{ matrix.std }} (${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        std: [11, 14, 17, 20, 23]
        mode: [default, fallback]
        exclude:
          - os: windows-latest
            std: 11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.mode }}" = "fallback" ]; then
            EXTRA_FLAGS="-DCOMPAT_FORCE_FALLBACK=ON -DCOMPAT_FORCE_SELF_IMPLEMENTATION=1"
          fi
          cmake -B build \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_BUILD_TYPE=Release \
            $EXTRA_FLAGS

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify Packaging Scripts
        run: |
          python scripts/bundle_header.py -v
          python scripts/export_module.py -v
          python scripts/test_packaging.py
